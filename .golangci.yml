version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - unused
    - ineffassign
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - gosec
    - misspell
    - gocyclo
    - depguard
    - revive
  settings:
    gocyclo:
      min-complexity: 25

    depguard:
      rules:
        no-std-log:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: "log$"
              desc: "Use structured logging instead of the standard log package"

    revive:
      severity: warning
      confidence: 0.8

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gocyclo
          - gosec
          - rowserrcheck
          - sqlclosecheck
      - path: ^(core/config|core/logger|server/http)/
        linters:
          - depguard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
