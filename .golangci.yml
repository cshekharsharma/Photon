version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: all        # Turn on all available linters
  disable:
    - dupl            # May be noisy — turn back on if you want to force DRY
    - funlen          # Turn on if you want max function length constraints
    - godot           # Optional: enforces period at end of doc comments
    - lll             # Line length limit (often noisy with long URLs/imports)
  settings:
    gocyclo:
      min-complexity: 10

    revive:
      severity: warning
      confidence: 0.8

    depguard:
      rules:
        main:
          deny:
            - pkg: "fmt$"
              desc: "Use your structured logger instead of fmt"
            - pkg: "log$"
              desc: "Use your custom logger instead of log"

    errcheck:
      check-type-assertions: true
      check-blank: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
