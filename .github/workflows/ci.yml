name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./cloud ./cloud/providers ./cloud/service/aws ./core/logger ./telemetry ./coordination/network/discovery ./coordination/network/watcher ./middleware ./server/grpc/server ./server/http ./storage/aerospike ./storage/memcached ./storage/elasticsearch ./storage/mongo ./storage/mysql ./storage/redis ./utils/rest ./notifier/notifyrclient ./workers

      - name: Package coverage
        run: |
          set -euo pipefail
          go run tools/gotest_exec.go --skip-mocks
          go run tools/gotest_coverage.go
          go tool cover -func=coverage.txt | awk '$3 != "100.0%" { print; failed = 1 } END { exit failed }'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install lint tools
        run: make tools

      - name: Lint
        run: |
          set -euo pipefail
          make lint
          git diff --exit-code

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
