# SonarQube server
sonar.host.url=https://sonarqube.cshekharsharma.in

# Authentication (token is preferred over login+password)
sonar.login=your_sonarqube_token_here
# sonar.login=admin
# sonar.password=admin

# Project details
sonar.projectName=Photon
sonar.projectKey=photon

# Source and test configuration
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.go
sonar.exclusions=**/vendor/**, **/*.gen.go

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8

# Go test coverage
sonar.go.coverage.reportPaths=coverage.txt